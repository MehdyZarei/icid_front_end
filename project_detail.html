<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICID — Project Detail</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-brand">ICID</div>
  <div class="navbar-right">
    <span class="nav-user-name" id="nav-user-name"></span>
    <div class="nav-avatar" id="nav-avatar"></div>
  </div>
</nav>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-profile">
      <div class="sidebar-avatar" id="sidebar-avatar"></div>
      <div class="sidebar-profile-info">
        <div class="sidebar-profile-name" id="sidebar-name"></div>
        <div class="sidebar-profile-company" id="sidebar-company"></div>
      </div>
    </div>

    <span class="sidebar-section-label">Menu</span>

    <a href="projects.html" class="sidebar-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      My Projects
    </a>

    <a href="#" class="sidebar-item active">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Reports
    </a>

    <a href="#" class="sidebar-item" onclick="soon(event)">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Team
    </a>

    <span class="sidebar-section-label">Account</span>

    <a href="#" class="sidebar-item" onclick="soon(event)">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>

    <a href="#" class="sidebar-item" onclick="soon(event)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>

    <div style="flex:1"></div>

    <a href="index.html" class="sidebar-item" onclick="signOut(event)" style="margin-top:8px; color: var(--gray-500);">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </a>
  </aside>

  <!-- Main -->
  <main class="main-content">

    <!-- Back button -->
    <div style="margin-bottom: 16px;">
      <a href="projects.html" class="btn btn-ghost" style="display:inline-flex;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Projects
      </a>
    </div>

    <div id="project-content">
      <div class="loading">Loading project…</div>
    </div>

  </main>
</div>

<script>
  const API = 'https://icid-backend.vercel.app';

  // ── Auth guard ──────────────────────────────────────────────
  const raw = localStorage.getItem('icid_user');
  if (!raw) { window.location.href = 'index.html'; }
  const user = JSON.parse(raw);

  // ── Populate user info ──────────────────────────────────────
  document.getElementById('nav-user-name').textContent = user.name;
  document.getElementById('nav-avatar').textContent = user.initials;
  document.getElementById('sidebar-avatar').textContent = user.initials;
  document.getElementById('sidebar-name').textContent = user.name;
  document.getElementById('sidebar-company').textContent = user.employer || '';

  // ── Get project ID from URL ─────────────────────────────────
  const projectId = new URLSearchParams(window.location.search).get('id');
  if (!projectId) { window.location.href = 'projects.html'; }

  // ── Status badge ────────────────────────────────────────────
  function statusBadge(status) {
    if (!status) return '';
    const s = status.toLowerCase();
    let cls = 'badge-gray';
    if (s.includes('active'))      cls = 'badge-green';
    else if (s.includes('pending') || s.includes('design')) cls = 'badge-amber';
    else if (s.includes('closed') || s.includes('complete')) cls = 'badge-blue';
    return `<span class="badge ${cls}">${status}</span>`;
  }

  // ── Render project ──────────────────────────────────────────
  function renderProject(p) {
    document.title = `ICID — ${p.project_name}`;
    document.getElementById('project-content').innerHTML = `

      <!-- Header card -->
      <div class="card" style="margin-bottom: 12px;">
        <div class="detail-header">
          <div>
            <div class="detail-title">${p.project_name}</div>
            <div style="margin-top: 8px;">${statusBadge(p.status)}</div>
          </div>
          <button class="btn btn-primary" onclick="soon()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Submit Report
          </button>
        </div>

        <div class="detail-grid">
          <div class="detail-field">
            <label>Project ID</label>
            <p>${p.project_id}</p>
          </div>
          <div class="detail-field">
            <label>Borough</label>
            <p>${p.borough || '—'}</p>
          </div>
          <div class="detail-field">
            <label>Registration Code</label>
            <p>${p.registration_code || '—'}</p>
          </div>
          <div class="detail-field">
            <label>Status</label>
            <p>${p.status || '—'}</p>
          </div>
          ${p.project_description ? `
          <div class="detail-field full-width">
            <label>Description</label>
            <p>${p.project_description}</p>
          </div>` : ''}
        </div>
      </div>

      <!-- Reports placeholder -->
      <div class="card">
        <div class="section-title">Reports</div>
        <div class="empty-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cdd1d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <p>No reports submitted yet.</p>
        </div>
      </div>
    `;
  }

  // ── Load project ────────────────────────────────────────────
  async function loadProject() {
    try {
      const res = await fetch(`${API}/v1/projects/${projectId}`);
      if (res.status === 404) {
        document.getElementById('project-content').innerHTML =
          `<div class="empty-state"><p>Project not found.</p></div>`;
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      renderProject(json.data);
    } catch (err) {
      console.error(err);
      document.getElementById('project-content').innerHTML =
        `<div class="empty-state"><p>Could not load project. Please try again.</p></div>`;
    }
  }

  function signOut(e) {
    e.preventDefault();
    localStorage.removeItem('icid_user');
    window.location.href = 'index.html';
  }

  function soon() { alert('Coming soon.'); }

  loadProject();
</script>

</body>
</html>
